<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#292524" stroke-width="3" />

  <!-- Shield / House Geometric Structure -->
  <g transform="translate(0, 8)" filter="url(#glow)">
    <!-- Central Tower / Pillar -->
    <path d="M256 96 L376 186 L376 396 L256 396 L256 96 Z" fill="url(#primaryGrad)" opacity="0.95" />
    <path d="M256 96 L136 186 L136 396 L256 396 L256 96 Z" fill="url(#accentGrad)" opacity="0.85" />

    <!-- Modern Windows / Community Grid lines -->
    <!-- Tower 1 Windows -->
    <rect x="168" y="210" width="28" height="28" rx="6" fill="#0c0a09" opacity="0.65" />
    <rect x="208" y="210" width="28" height="28" rx="6" fill="#0c0a09" opacity="0.65" />
    <rect x="168" y="254" width="28" height="28" rx="6" fill="#0c0a09" opacity="0.65" />
    <rect x="208" y="254" width="28" height="28" rx="6" fill="#0c0a09" opacity="0.65" />
    <rect x="168" y="298" width="28" height="28" rx="6" fill="#0c0a09" opacity="0.65" />
    <rect x="208" y="298" width="28" height="28" rx="6" fill="#0c0a09" opacity="0.65" />

    <!-- Tower 2 Windows -->
    <rect x="276" y="210" width="28" height="28" rx="6" fill="#0c0a09" opacity="0.65" />
    <rect x="316" y="210" width="28" height="28" rx="6" fill="#0c0a09" opacity="0.65" />
    <rect x="276" y="254" width="28" height="28" rx="6" fill="#0c0a09" opacity="0.65" />
    <rect x="316" y="254" width="28" height="28" rx="6" fill="#0c0a09" opacity="0.65" />
    <rect x="276" y="298" width="28" height="28" rx="6" fill="#0c0a09" opacity="0.65" />
    <rect x="316" y="298" width="28" height="28" rx="6" fill="#0c0a09" opacity="0.65" />

    <!-- Central Portal / Archway -->
    <path d="M228 396 L228 340 Q256 320 284 340 L284 396 Z" fill="#0c0a09" />

    <!-- Connected Society Roof Apex Emblem -->
    <circle cx="256" cy="96" r="16" fill="#ecfdf5" />
    <circle cx="136" cy="186" r="12" fill="#a7f3d0" />
    <circle cx="376" cy="186" r="12" fill="#a7f3d0" />
  </g>
</svg>
